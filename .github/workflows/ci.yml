name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
      - name: Validate the manifest
        run: composer validate --strict
      - name: Lint every source file on the oldest supported PHP
        run: find src bin -name '*.php' -print0 | xargs -0 -n1 php -l
