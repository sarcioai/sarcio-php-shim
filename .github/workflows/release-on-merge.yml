name: release-on-merge

# Merging a version bump IS the release. On every push to main this reads the
# version from the `Licensed Work:` line of LICENSE (composer.json carries no version); if no v<version> tag exists yet it creates the tag and
# runs the release workflow for it. Any other merge does nothing, and a version
# can only be released once, which is what makes this safe to run unattended.
# (A tag pushed by a workflow does not start another workflow, so the release
# is called directly rather than left to the tag trigger.)
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-on-merge
  cancel-in-progress: false

jobs:
  plan:
    name: is there a version to release?
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release tag
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: |
          version="$(sed -nE 's/^Licensed Work:[[:space:]]+[^[:space:]]+[[:space:]]+([0-9][^,[:space:]]*),.*/\1/p' LICENSE)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::could not read a version (got '$version')"
            exit 1
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released; nothing to do."
            exit 0
          fi
          git config user.name 'Sarcio Releases'
          git config user.email 'releases@sarcio.io'
          git tag -a "$tag" -m "$tag"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.tag != ''
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
    secrets: inherit
